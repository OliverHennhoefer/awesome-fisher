name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and content
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build and verify static output
        run: npm run build
      - name: Install browsers for end-to-end tests
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser and accessibility tests
        run: npm run test:e2e
